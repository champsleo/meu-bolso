# ---------- Servidor ----------
spring.application.name=meubolso-api
server.port=8080

# ---------- Banco de dados (H2 salvo na pasta ./data) ----------
spring.datasource.url=jdbc:h2:file:./data/meubolso
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Segurança (JWT) ----------
# Chave secreta em Base64 (mínimo 32 bytes). Em produção, defina a variável de ambiente JWT_SECRET.
app.jwt.secret=${JWT_SECRET:bWV1Ym9sc28tY2hhdmUtc2VjcmV0YS1wYXJhLWRlc2Vudm9sdmltZW50by0yMDI2}
app.jwt.expiracao-horas=24

# ---------- Dados de demonstração ----------
# Cria o usuário demo@meubolso.com (senha 123456) com lançamentos de exemplo.
app.demo.habilitado=true

# ---------- Documentação (Swagger) ----------
springdoc.swagger-ui.path=/swagger-ui.html
